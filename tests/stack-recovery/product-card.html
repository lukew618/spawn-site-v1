<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ENG-014 flies card title fixture</title>
    <link rel="stylesheet" href="../../assets/spawn-typography.css" />
    <link rel="stylesheet" href="../../assets/spawn-storefront.css" />
    <style>
      :root {
        --font-body-family: Georgia, "Times New Roman", serif;
        --font-heading-family: Georgia, "Times New Roman", serif;
      }
      body { margin: 48px; background: #f6f3ee; }
      .proof { margin-top: 16px; font: 14px/1.4 sans-serif; }
    </style>
  </head>
  <body class="spawn-type spawn-storefront">
    <div id="MainContent">
      <div class="collection-premium">
        <h3 class="cp-card__title">
          <a href="/products/spawn-unreal-dub">Spawn Unreal Dub</a>
        </h3>
        <h3 class="card__heading">Dawn card title</h3>
      </div>
    </div>
    <p class="proof" id="proof"></p>
    <script>
      const flies = getComputedStyle(document.querySelector(".cp-card__title"));
      const dawn = getComputedStyle(document.querySelector(".card__heading"));
      document.getElementById("proof").textContent =
        "flies " + flies.fontSize + " / line-height " + flies.lineHeight +
        " | dawn " + dawn.fontSize;
    </script>
  </body>
</html>
